model_list:
  - model_name: APAC-claude-3-sonnect
    litellm_params:
      model: bedrock/global.anthropic.claude-haiku-5-5
      aws_region_name: os.environ/AWS_REGION

  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-5
      aws_region_name: os.environ/AWS_REGION
  
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-6
      model_id: os.environ/AWS_MODEL_ID # AWS베드락 추론프로파일 ARN
      aws_region_name: os.environ/AWS_REGION

guardrails:
  # AWS에 생성한 정책으로 입력 검사·마스킹
  - guardrail_name: aws-bedrock-guardrail
    litellm_params:
      guardrail: my_bedrockguardrail.my_bedrockguardrail
      mode: pre_call

      guardrailIdentifier: os.environ/AWS_GUARDRAIL_ID
      guardrailVersion: "DRAFT"
      aws_region_name: os.environ/AWS_REGION
      
      default_on: true
      mask_request_content: true

  # AWS에 생성한 정책으로 응답 검사·마스킹·grounding
  - guardrail_name: aws-bedrock-grounding
    litellm_params:
      guardrail: bedrock
      mode: post_call

      guardrailIdentifier: os.environ/AWS_GUARDRAIL_ID
      guardrailVersion: "DRAFT"
      aws_region_name: os.environ/AWS_REGION

      mask_response_content: true 
      contextual_grounding_from_messages: true

      # 응답 전체를 검사한 뒤 클라이언트에 전달
      streaming_buffer_until_moderated: true
      streaming_end_of_stream_only: true

  # 정책 ID 없이 검사 항목을 직접 지정하는 별도 가드레일, AWS가드레일 정책 설정없이 코드래벨에서 정책 정의 가능
  - guardrail_name: aws-bedrock-checks
    litellm_params:
      guardrail: bedrock
      mode: pre_call

      # checks API 지원 리전 서울 미지원
      aws_region_name: os.environ/AWS_REGION
      aws_role_name: os.environ/AWS_ROLE_ARN

      checks:
        contentFilter:
          categories:
            - category: VIOLENCE
            - category: HATE
            - category: SEXUAL
            - category: MISCONDUCT
            - category: INSULTS

        promptAttack:
          categories:
            - category: JAILBREAK
            - category: PROMPT_INJECTION
            - category: PROMPT_LEAKAGE

        sensitiveInformation:
          entities:
            - type: EMAIL
            - type: PHONE
            - type: CREDIT_DEBIT_CARD_NUMBER
            - type: AWS_ACCESS_KEY
            - type: AWS_SECRET_KEY

      content_filter_threshold: 0.1
      prompt_attack_threshold: 0.5
      pii_confidence_threshold: 0.7

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  proxy_config_reload_interval_seconds: 30 #  default: 30초마다 config.yaml 변경 감지 후 재적용
  database_connection_pool_limit: 10 # connection pooling 10개 제한
  #disable_env_credential_login: true
  
  # 상단 ALB 구성 시 ALB 서브넷 대역 설정
  trusted_proxy_ranges: ["0.0.0.0/0"] 
  use_x_forwarded_for: true

litellm_settings:
  callbacks:
    - s3_access_logger_handler.handler
    - websearch_interception

## 인터넷 검색도구 호출설정 (Tool : tavily-search / 매달 1000토큰 무료)
  websearch_interception_params:
    enabled_providers:
      - bedrock
    search_tool_name: tavily-search

# travily-search tool 설정
search_tools:
  - search_tool_name: tavily-search
    litellm_params:
      search_provider: tavily
      api_key: os.environ/TAVILY_API_KEY


